name: Build Fritchii v6.2 (Windows MSVC)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 MSVC Release
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Check out Fritchii v6.2 source
        uses: actions/checkout@v5
        with:
          repository: Frizti/Fritchii
          ref: 16396c8813fed6de50f6062f56ad3bc924044289
          fetch-depth: 0

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools
        shell: pwsh
        run: glslangValidator --version

      - name: Adjust MSVC warning promotions for CI
        shell: pwsh
        run: |
          $path = "src/CMakeLists.txt"
          $source = Get-Content $path -Raw

          $warnings = @(
            @{ Flag = "4456"; Description = "hides previous local declaration" },
            @{ Flag = "4457"; Description = "hides function parameter" },
            @{ Flag = "4458"; Description = "hides class member" },
            @{ Flag = "4459"; Description = "hides global declaration" }
          )

          foreach ($warning in $warnings) {
            $flag = $warning.Flag
            $description = $warning.Description
            $pattern = "(?m)^[ \t]*/we$flag[ \t]+# Declaration of 'identifier' $([regex]::Escape($description))\r?\n?"

            $matches = [regex]::Matches($source, $pattern)

            if ($matches.Count -ne 1) {
              throw "Expected exactly one C$flag warning-as-error setting, found $($matches.Count)."
            }

            $source = [regex]::Replace($source, $pattern, "")
            Write-Host "Removed only the C$flag warning-as-error promotion."
          }

          [System.IO.File]::WriteAllText(
            $path,
            $source,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "The four warnings remain enabled; only their error promotions were removed."

      - name: Fix MSVC DMA statistics conversion
        shell: pwsh
        run: |
          $path = "src/video_core/engines/maxwell_dma.cpp"
          $source = Get-Content $path -Raw

          $old = 'u64{regs.pitch_out}'
          $new = 'static_cast<u64>(std::abs(static_cast<s64>(regs.pitch_out)))'

          $matches = [regex]::Matches($source, [regex]::Escape($old))

          if ($matches.Count -ne 1) {
            throw "Expected exactly one DMA statistics conversion, found $($matches.Count)."
          }

          $source = $source.Replace($old, $new)

          [System.IO.File]::WriteAllText(
            $path,
            $source,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Adjusted only the signed DMA pitch conversion used for statistics."

      - name: Fix MSVC Vulkan pipeline cache preprocessor compatibility
        shell: pwsh
        run: |
          $path = "src/video_core/renderer_vulkan/vk_pipeline_cache.cpp"
          $source = Get-Content $path -Raw

          $message = "The driver's cache does not hold the precompiled pipelines:"
          $messagePosition = $source.IndexOf($message)

          if ($messagePosition -lt 0) {
            throw "Could not find the expected Vulkan pipeline cache warning."
          }

          $startMarker = "        LOG_WARNING(Render_Vulkan,"
          $start = $source.LastIndexOf($startMarker, $messagePosition)

          if ($start -lt 0) {
            throw "Could not find the beginning of the Vulkan warning block."
          }

          $endMarker = "#endif"
          $end = $source.IndexOf($endMarker, $messagePosition)

          if ($end -lt 0) {
            throw "Could not find the platform-specific #endif."
          }

          $end += $endMarker.Length

          $oldBlock = $source.Substring($start, $end - $start)

          if ($oldBlock -notmatch 'NVIDIA on Linux:' -or
              $oldBlock -notmatch 'NVIDIA: set Shader Cache Size') {
            throw "The original platform-specific warning does not match expectations."
          }

          $newBlock = @'
          #ifdef _WIN32
                  const char* cache_advice =
                      device.GetDriverID() == VK_DRIVER_ID_AMD_PROPRIETARY
                          ? "AMD: check Adrenalin > Gaming > Graphics > Shader Cache is on (not Off) "
                            "and never use Reset Shader Cache; the folder sizes in the Driver cache "
                            "folder lines show what the driver kept"
                          : "NVIDIA: set Shader Cache Size to Unlimited in the NVIDIA Control Panel";
          #else
                  const char* cache_advice =
                      device.GetDriverID() == VK_DRIVER_ID_AMD_PROPRIETARY
                          ? "AMD: check Adrenalin > Gaming > Graphics > Shader Cache is on (not Off) "
                            "and never use Reset Shader Cache; the folder sizes in the Driver cache "
                            "folder lines show what the driver kept"
                          : "NVIDIA on Linux: the Driver cache folder line shows the folder and its "
                            "__GL_SHADER_DISK_CACHE variables; keep space free on its disk";
          #endif
                  LOG_WARNING(Render_Vulkan,
                              "The driver's cache does not hold the precompiled pipelines: {} of {} prepared "
                              "pipelines were compiled again, each a stall where a draw waits for it. {}",
                              kept_compiles_session.slow, kept_compiles_session.builds, cache_advice);
'@

          $source = $source.Substring(0, $start) + $newBlock + $source.Substring($end)

          [System.IO.File]::WriteAllText(
            $path,
            $source,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Fixed the Vulkan pipeline cache warning for MSVC."

      - name: Configure Windows build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DLICHII_BUILD_TAG=build-${{ github.run_number }} \
            -DLICHII_BUILD_PLATFORM=windows-x86_64 \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            2>&1 | tee configure.log

      - name: Build executables
        shell: bash
        env:
          FRITCHII_SHADER_STAMP_ANY: "1"
        run: |
          set -euo pipefail
          sccache --zero-stats
          cmake --build build/release --target yuzu --parallel \
            2>&1 | tee build.log
          sccache --show-stats

      - name: Stop sccache
        if: always()
        shell: pwsh
        run: sccache --stop-server

      - name: Verify Windows executables
        shell: pwsh
        run: |
          $binDir = "build/release/bin"

          foreach ($exe in 'fritchii.exe', 'lichii.exe') {
            if (-not (Test-Path "$binDir/$exe")) {
              throw "$exe was not produced by the build."
            }
          }

          Write-Host "Both expected executables were produced successfully."

      - name: Prepare artifact and build information
        shell: pwsh
        run: |
          $binDir = "$env:GITHUB_WORKSPACE/build/release/bin"
          $artifactDir = "$env:GITHUB_WORKSPACE/artifact"

          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          Copy-Item "$binDir/*" -Destination $artifactDir -Recurse -Force

          $sourceCommit = git rev-parse HEAD
          $buildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss UTC")

          @"
          Fritchii Windows Build Information
          ==================================

          Source repository: https://github.com/Frizti/Fritchii
          Source release: fritchii-v6.2
          Source commit: $sourceCommit

          Build system: GitHub Actions
          Runner: Windows Server 2022
          Compiler: MSVC
          Build configuration: Release
          Architecture: x86_64

          Qt version: 6.8.3
          Vulkan SDK version: 1.4.341.1
          Build date: $buildDate
          Workflow run: ${{ github.run_number }}

          Executables:
          - fritchii.exe
          - lichii.exe

          Build adjustments:
          1. MSVC warning-as-error promotions C4456, C4457, C4458
             and C4459 were removed temporarily during CI.
             The warnings themselves remain enabled.
          2. The signed DMA pitch conversion used for memory-write
             statistics was adjusted for MSVC compatibility.
          3. The Vulkan pipeline cache warning was refactored to
             avoid preprocessor directives inside macro arguments.
          4. FRITCHII_SHADER_STAMP_ANY=1 was enabled for this test
             build to permit an unrecognized shader stamp.

          No application features were intentionally removed.

          Note:
          This is a manually triggered source build.
          It is not an official precompiled release binary.
          "@ | Set-Content "$artifactDir/BUILD-INFO.txt" -Encoding UTF8

          Copy-Item configure.log, build.log -Destination $artifactDir

          $hashes = Get-ChildItem -Path $artifactDir -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -Path $_.FullName
              $relative = $_.FullName.Substring($artifactDir.Length + 1)
              "$($hash.Hash)  $relative"
            }

          $hashes | Set-Content "$artifactDir/SHA256SUMS.txt" -Encoding UTF8

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: Fritchii-v6.2-Windows-MSVC
          path: artifact/
          if-no-files-found: error
          retention-days: 7
